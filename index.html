.join:active {

}

.join-text {
  display: flex;
  flex-direction: column;

}

.join-small {

.cards {

  grid-template-columns: repeat(3, 1fr);

}

.card {

  align-items: center;

.icon {

}

.card span {
  color: #d6e8f2;
  font-size: 8px;
  font-weight: 600;

  text-transform: uppercase;
}

.footer {
  text-align: center;
  padding: 13px 0 0;

  font-size: 8px;
  letter-spacing: 2.5px;
